[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "var-backtest-uq"
version = "0.1.0"
description = "Live VaR/ES backtester with Conformal-PID calibration on a 3-asset cross-asset book. Companion code for var-backtest.mtanti.com."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Matthew Tanti", email = "matthew@mtanti.com" }]
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "yfinance>=0.2.40",
    "arch>=7.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://var-backtest.mtanti.com"
Documentation = "https://var-backtest.mtanti.com/manual"
# Repository/Changelog URLs return when the var-backtest repo is published
# (planned under github.com/m-tanti). Do not point at github.com/mtanti: that
# username belongs to someone else.

[tool.hatch.build.targets.wheel]
packages = ["src/var_backtest_uq"]
