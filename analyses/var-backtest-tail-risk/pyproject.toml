[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "var-backtest-uq"
version = "0.1.0"
description = "Walk-forward VaR/ES backtester with Conformal-PID calibration on a 3-asset cross-asset book. Companion code for kwantil.com/var-backtest."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Matthew Tanti", email = "matthew@mtanti.com" }]
readme = "README.md"
# Pinned rather than bounded, to the versions that reproduced the published
# summary, row-level output and both reference sweeps byte for byte on 2026-11-11.
dependencies = [
    "numpy==1.26.4",
    "scipy==1.17.1",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "yfinance==1.2.0",
    "arch==7.2.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[project.urls]
Homepage = "https://kwantil.com/var-backtest/"
Documentation = "https://kwantil.com/var-backtest/manual"
# Repository/Changelog URLs return when the var-backtest repo is published
# (planned under github.com/m-tanti). Do not point at github.com/mtanti: that
# username belongs to someone else.

[tool.hatch.build.targets.wheel]
packages = ["src/var_backtest_uq"]
